<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivanshi Photo Studio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:28px 18px 35px;
  text-align:center;
}

.logo{
  width:180px;
  height:180px;
  border:3px solid #d9ad45;
  border-radius:50%;
  margin:5px auto 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:#111;
}

h1{
  margin:0;
  color:#e7bd5a;
  font-size:30px;
  letter-spacing:1px;
}

.sub{
  color:#bbb;
  margin:8px 0 28px;
  font-size:18px;
}

a{
  display:flex;
  align-items:center;
  gap:16px;
  text-decoration:none;
  color:#fff;
  background:#151515;
  border:1px solid #5b4720;
  border-radius:20px;
  padding:14px;
  margin:10px 0;
  min-height:90px;
}

a:active{
  transform:scale(.98);
}

.icon{
  width:58px;
  height:58px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
  font-size:28px;
  flex-shrink:0;
}

.name{
  text-align:left;
  font-size:18px;
  font-weight:700;
}

.small{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-top:3px;
  font-weight:400;
}

.footer{
  margin-top:28px;
  color:#caa451;
  font-size:13px;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="logo">📷</div>

  <h1>Shivanshi Photo Studio</h1>

  <div class="sub">
    Scan • Connect • Follow
  </div>


  <!-- FACEBOOK -->
  <a href="https://www.facebook.com/profile.php?id=61594784124054"
     target="_blank"
     rel="noopener noreferrer">
    <div class="icon">f</div>
    <div class="name">
      Facebook
      <span class="small">Visit our Facebook</span>
    </div>
  </a>


  <!-- INSTAGRAM -->
  <a href="https://www.instagram.com/sivanshi_photo_studio?stkn=eWhkY3oyOWt0anNo"
     target="_blank"
     rel="noopener noreferrer">
    <div class="icon">◎</div>
    <div class="name">
      Instagram
      <span class="small">Follow on Instagram</span>
    </div>
  </a>


  <!-- WHATSAPP -->
  <a href="https://wa.me/qr/6OCM67NWO3HTG1"
     target="_blank"
     rel="noopener noreferrer">
    <div class="icon">◔</div>
    <div class="name">
      WhatsApp
      <span class="small">Chat with us</span>
    </div>
  </a>


  <!-- GOOGLE MAPS -->
  <a href="https://maps.app.goo.gl/9Xi223s4fN8hp2hV8?g_st=ac"
     target="_blank"
     rel="noopener noreferrer">
    <div class="icon">⌖</div>
    <div class="name">
      Location
      <span class="small">Open Google Maps</span>
    </div>
  </a>


  <!-- TIKTOK -->
  <a href="https://www.tiktok.com/@sivanshi_photostudio"
     target="_blank"
     rel="noopener noreferrer">
    <div class="icon">♪</div>
    <div class="name">
      TikTok
      <span class="small">Follow on TikTok</span>
    </div>
  </a>


  <div class="footer">
    CAPTURE • CREATE • CHERISH
  </div>

</div>

</body>
</html>
